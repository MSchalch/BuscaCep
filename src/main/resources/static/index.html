<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca CEP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Consulta de CEP</h1>
    <form id="cepForm">
        <input type="text" id="cep" placeholder="Digite o CEP" required>
        <button type="submit">Buscar</button>
    </form>
    <div id="resultado" class="resultado"></div>
</div>

<script>
    document.getElementById("cepForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const cep = document.getElementById("cep").value;
        const resultado = document.getElementById("resultado");

        try {
            const response = await fetch(`/api/cep?cep=${cep}`);
            if (!response.ok) {
                throw new Error("Erro ao buscar o CEP");
            }

            const dados = await response.json();
            if (dados.erro) {
                resultado.innerHTML = "<p>CEP não encontrado.</p>";
            } else {
                resultado.innerHTML = `
                        <p><strong>Logradouro:</strong> ${dados.logradouro}</p>
                        <p><strong>Bairro:</strong> ${dados.bairro}</p>
                        <p><strong>Cidade:</strong> ${dados.localidade}</p>
                        <p><strong>Estado:</strong> ${dados.uf}</p>
                    `;
            }
        } catch (error) {
            resultado.innerHTML = `<p>Erro: ${error.message}</p>`;
        }
    });
</script>
</body>
</html>
